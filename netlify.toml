# Netlify — 빌드 없는 정적 덱.
# 이 저장소는 덱 자체가 루트이므로 publish 가 "." 이다.
# publish 가 루트라는 것은 여기 넣는 파일이 전부 공개 URL 로 열린다는 뜻이다 —
# 내부 메모 · 견적 같은 것은 이 폴더에 두지 않는다.
[build]
  publish = "."

# 스토리보드 컷은 같은 파일명으로 교체된다. 오래 캐싱하면 옛 컷이 남는다.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# 좌표·문구 수정이 잦은 파일들 — 매번 재검증시킨다.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
